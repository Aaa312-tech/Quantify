name: Research code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON: python
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/../quantfolio-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --no-install-project --python python
      - name: Build source distribution and wheel
        run: uv build --python python
      - name: Check the source distribution contents
        shell: python
        run: |
          from pathlib import Path
          import tarfile

          source = next(Path('dist').glob('*.tar.gz'))
          prefix = source.name.removesuffix('.tar.gz')
          required = ('.python-version', 'uv.lock', 'examples/offline_backtest.py', 'NOTICE.md', 'README.md')
          with tarfile.open(source) as archive:
              for name in required:
                  member = archive.extractfile(f'{prefix}/{name}')
                  if member is None or member.read() != Path(name).read_bytes():
                      raise SystemExit(f'Source distribution is missing or changed: {name}')
      - name: Install and check the built wheel
        run: |
          uv run --no-sync python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call(['uv', 'pip', 'install', '--python', sys.executable, '--no-deps', str(wheel)])"
          uv pip check --python "${{ env.UV_PROJECT_ENVIRONMENT }}"
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --project "${{ github.workspace }}" --no-sync python -m quantfolio --version
          uv run --project "${{ github.workspace }}" --no-sync python -c "import os, pathlib, quantfolio; from importlib.resources import files; assert not pathlib.Path(quantfolio.__file__).is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE'])); assert files('quantfolio').joinpath('templates/report.html').is_file()"
      - name: Run the offline example with the installed wheel
        working-directory: ${{ runner.temp }}
        run: uv run --project "${{ github.workspace }}" --no-sync python "${{ github.workspace }}/examples/offline_backtest.py" --output "${{ runner.temp }}/offline-example"
      - name: Prepare check outputs
        run: uv run --no-sync python -c "import pathlib, subprocess; pathlib.Path('quality-results').mkdir(); pathlib.Path('quality-results/commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))"
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests scripts examples
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts examples
      - name: Check migrated types
        run: uv run --no-sync mypy --junit-xml quality-results/types.xml
      - name: Run unit tests
        run: uv run --no-sync coverage run --data-file=quality-results/.coverage.unit -m pytest -q -m "not integration" --junitxml=quality-results/unit.xml
      - name: Run offline integration tests
        run: uv run --no-sync coverage run --data-file=quality-results/.coverage.integration -m pytest -q -m integration --junitxml=quality-results/integration.xml
      - name: Check coverage against the frozen baseline
        run: |
          uv run --no-sync coverage combine --data-file=quality-results/.coverage quality-results/.coverage.unit quality-results/.coverage.integration
          uv run --no-sync coverage json --data-file=quality-results/.coverage -o quality-results/coverage.json
          uv run --no-sync python scripts/check_coverage.py quality-results/coverage.json
      - name: Check financial and integrity fault detection
        run: uv run --no-sync python -B scripts/check_faults.py --output quality-results/faults
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: quality-results/
          retention-days: 14
