name: Research code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source distribution and wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install the built wheel
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])"
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m quantfolio --version
          python -c "import os, pathlib, quantfolio; from importlib.resources import files; assert not pathlib.Path(quantfolio.__file__).is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE'])); assert files('quantfolio').joinpath('templates/report.html').is_file()"
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test installed package and synthetic workflows
        run: python -B -m pytest -q
