name: Research code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON: python
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/../quantfolio-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --no-install-project --python python
      - name: Build source distribution and wheel
        run: uv build --python python
      - name: Install and check the built wheel
        run: |
          uv run --no-sync python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call(['uv', 'pip', 'install', '--python', sys.executable, '--no-deps', str(wheel)])"
          uv pip check --python "${{ env.UV_PROJECT_ENVIRONMENT }}"
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --project "${{ github.workspace }}" --no-sync python -m quantfolio --version
          uv run --project "${{ github.workspace }}" --no-sync python -c "import os, pathlib, quantfolio; from importlib.resources import files; assert not pathlib.Path(quantfolio.__file__).is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE'])); assert files('quantfolio').joinpath('templates/report.html').is_file()"
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Test installed package and synthetic workflows
        run: uv run --no-sync python -B -m pytest -q
