[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio-research"
dynamic = ["version"]
description = "Walk-forward A-share portfolio research with audited execution and frozen evidence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.5", "build==1.3.0"]
status-data = ["baostock==0.9.4"]

[project.urls]
Repository = "https://github.com/Aaa312-tech/Quantify"
Documentation = "https://github.com/Aaa312-tech/Quantify/blob/main/docs/reproducibility.md"
Changelog = "https://github.com/Aaa312-tech/Quantify/blob/main/CHANGELOG.md"

[project.scripts]
quantfolio = "quantfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quantfolio.__version__"}

[tool.setuptools.package-data]
quantfolio = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["data", "artifacts", "reports", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
