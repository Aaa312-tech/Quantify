[build-system]
requires = ["setuptools==78.1.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio-research"
dynamic = ["version"]
description = "Walk-forward portfolio research for Chinese equities"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.5",
    "build==1.3.0",
    "coverage==7.17.4",
    "mypy==2.4.1",
    "pandas-stubs==2.3.3.260113",
]
status-data = ["baostock==0.9.4"]
disclosures = ["pypdf==6.9.2"]
industry-data = ["pypdf==6.9.2", "PyMuPDF==1.27.2.3"]

[project.urls]
Repository = "https://github.com/Aaa312-tech/Quantify"
Documentation = "https://github.com/Aaa312-tech/Quantify/blob/main/docs/index.md"
Changelog = "https://github.com/Aaa312-tech/Quantify/blob/main/CHANGELOG.md"

[project.scripts]
quantfolio = "quantfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "quantfolio.__version__"}

[tool.setuptools.package-data]
quantfolio = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: fixed offline signal, execution and account workflows"]

[tool.mypy]
python_version = "3.11"
files = ["src/quantfolio/settings.py", "src/quantfolio/storage.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true

[tool.coverage.run]
branch = true
source_pkgs = ["quantfolio"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["data/**", "artifacts/**", "reports/**", ".venv/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["quantfolio", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
required-version = "==0.13.9"
build-constraint-dependencies = ["setuptools==78.1.1", "wheel==0.45.1"]
